<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Campus Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a results-and-directions panel on the left, a pannable campus map on the right; on phones the map sits on top. */
:root {
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;

  --bg: #E6EDED;
  --panel: #FBFDFD;
  --soft: #EDF3F3;
  --ink: #10292C;
  --muted: #4B6466;
  --line: #C5D4D5;
  --accent: #1D4ED8;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE6FF;
  --start: #0B8A5E;
  --pin: #D9480F;
  --warn-bg: #FFF0D6;
  --warn-ink: #623A00;
  --ok-bg: #D9F2E6;
  --ok-ink: #0A5A3C;

  --outside: #D9E3E4;
  --lawn: #D1E4CF;
  --road: #FFFFFF;
  --road-edge: #B6C7C8;
  --steps: #E9B48A;
  --bld: #E2E9F1;
  --bld-hover: #CFDBEA;
  --bld-edge: #98ACC4;
  --bld-ink: #16324B;
  --water: #A8CCE6;
  --tree: #8CBA89;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1516; --panel: #112123; --soft: #172A2D; --ink: #E3EEEE; --muted: #9AB2B4; --line: #254144;
    --accent: #86AAFF; --accent-ink: #091A40; --accent-soft: #1A2C54;
    --start: #35D39A; --pin: #FF8F5A;
    --warn-bg: #3A2A10; --warn-ink: #FFD9A0; --ok-bg: #12372A; --ok-ink: #9BE8C6;
    --outside: #0D1B1D; --lawn: #16302A; --road: #2B4549; --road-edge: #172A2D; --steps: #85603E;
    --bld: #22374A; --bld-hover: #2D4A63; --bld-edge: #456A86; --bld-ink: #D8E7F3; --water: #1E4A66; --tree: #25543A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1516; --panel: #112123; --soft: #172A2D; --ink: #E3EEEE; --muted: #9AB2B4; --line: #254144;
  --accent: #86AAFF; --accent-ink: #091A40; --accent-soft: #1A2C54;
  --start: #35D39A; --pin: #FF8F5A;
  --warn-bg: #3A2A10; --warn-ink: #FFD9A0; --ok-bg: #12372A; --ok-ink: #9BE8C6;
  --outside: #0D1B1D; --lawn: #16302A; --road: #2B4549; --road-edge: #172A2D; --steps: #85603E;
  --bld: #22374A; --bld-hover: #2D4A63; --bld-edge: #456A86; --bld-ink: #D8E7F3; --water: #1E4A66; --tree: #25543A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-inline: 16px; padding-block: 12px;
  display: flex; flex-direction: column; gap: 12px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand div { min-width: 0; }
.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center; flex: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
}
.icon-btn:hover { background: var(--soft); }

.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(340px, 410px) minmax(0, 1fr); gap: 12px; }

/* panel */
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
}
.controls { padding: 14px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); flex: none; }
.field label.lbl { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.field select, .field input[type="text"], .field input[type="search"] {
  width: 100%; height: 42px; padding: 0 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px;
}
.field input::placeholder { color: var(--muted); }
.combo { position: relative; }
.sug {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; margin: 0; padding: 4px; list-style: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(8, 24, 28, 0.22);
  max-height: 330px; overflow-y: auto;
}
.sug li { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.sug li[aria-selected="true"], .sug li:hover { background: var(--accent-soft); }
.sug .n { font-weight: 500; min-width: 0; }
.sug .s { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.sug .d, .row .d { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sug .none { cursor: default; color: var(--muted); }
.sug .none:hover { background: transparent; }

.toggle { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.toggle input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.toggle b { display: block; font-weight: 600; }
.toggle span { color: var(--muted); font-size: 12px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 5px 11px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px;
}
.chip:hover { background: var(--soft); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.quick-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

.out { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }

/* browse list */
.sec-title { margin: 0; font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.row { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 9px 4px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.row:hover { background: var(--soft); }
.row .n { font-weight: 500; }
.row .s { display: block; font-size: 12px; color: var(--muted); }
.hint { color: var(--muted); margin: 0; }

/* route */
.rhead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.eyebrow { margin: 0 0 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pin); }
.rhead h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; text-wrap: balance; }
.where { margin: 4px 0 0; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.stats div { background: var(--soft); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stats dt { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.stats dd { margin: 2px 0 0; font-family: var(--font-mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stats dd small { font-size: 12px; font-family: var(--font-body); color: var(--muted); }
.badge { display: inline-block; font-family: var(--font-body) !important; font-size: 13px !important; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.badge.ok { background: var(--ok-bg); color: var(--ok-ink); }
.badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
.alert { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); }
.note { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: 0; }
.step { width: 100%; text-align: left; background: none; border: 0; padding: 10px 4px; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: start; border-radius: 6px; }
button.step:hover { background: var(--soft); }
.step[aria-current="true"] { background: var(--accent-soft); }
.step .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); border: 1px solid var(--line); color: var(--ink); }
.step.start .ic { background: var(--start); border-color: var(--start); color: #fff; }
.step.arrive .ic { background: var(--pin); border-color: var(--pin); color: #fff; }
.step.stairs .ic { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-bg); }
.step .t { font-weight: 600; display: block; }
.step .dt { display: block; color: var(--muted); font-size: 13px; }
.step .m { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; }
.divider { margin: 4px 0 0; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.alts { display: flex; flex-direction: column; gap: 2px; }

/* map */
.mapwrap { position: relative; background: var(--outside); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 300px; min-width: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
#map { --fs: 12px; }
.outside { fill: var(--outside); }
.campus { fill: var(--lawn); stroke: var(--road-edge); stroke-width: 2; }
.water { fill: var(--water); }
.tree { fill: var(--tree); }
.road-edge { stroke: var(--road-edge); stroke-width: 19; stroke-linecap: round; fill: none; }
.road { stroke: var(--road); stroke-width: 15; stroke-linecap: round; fill: none; }
.road.steps { stroke: var(--steps); stroke-width: 15; stroke-linecap: butt; stroke-dasharray: 3 3; }
.spur { stroke: var(--road-edge); stroke-width: 5; stroke-linecap: round; }
.door { fill: var(--bld-ink); }
.bld rect { fill: var(--bld); stroke: var(--bld-edge); stroke-width: 2; transition: fill 0.15s; }
.bld { cursor: pointer; outline: none; }
.bld:hover rect, .bld:focus-visible rect { fill: var(--bld-hover); }
.bld:focus-visible rect { stroke: var(--accent); stroke-width: 4; }
.bld.is-to rect { stroke: var(--pin); stroke-width: 4; fill: var(--bld-hover); }
.bld.is-from rect { stroke: var(--start); stroke-width: 4; }
.bld .code { font-family: var(--font-mono); font-weight: 500; fill: var(--bld-ink); font-size: min(var(--fs), 24px); text-anchor: middle; pointer-events: none; }
.bld .bname { font-family: var(--font-body); fill: var(--bld-ink); font-size: calc(min(var(--fs), 24px) * 0.82); text-anchor: middle; opacity: 0.85; pointer-events: none; }
#map.names-off .bname { display: none; }
.plaza { fill: var(--road); stroke: var(--road-edge); stroke-width: 2; }
.fountain { fill: var(--water); }
.landmark { font-family: var(--font-body); font-size: calc(var(--fs) * 0.8); fill: var(--bld-ink); opacity: 0.7; text-anchor: middle; pointer-events: none; }
#map.names-off .landmark { display: none; }
.gate { fill: none; stroke: var(--bld-ink); stroke-width: 4; stroke-linecap: round; }
.rt-casing { fill: none; stroke: var(--panel); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
.rt { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.rt-flow { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 12; opacity: 0.85; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -14; } }
.seg { fill: none; stroke: var(--pin); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
.mk-start { fill: var(--start); stroke: #fff; stroke-width: 3; }
.mk-end { fill: var(--pin); stroke: #fff; stroke-width: 3; }
.mk-ring { fill: none; stroke: var(--pin); stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: ring 1.8s ease-out infinite; }
@keyframes ring { from { transform: scale(0.6); opacity: 0.9; } to { transform: scale(2.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .rt-flow, .mk-ring { animation: none; } .rt-flow { display: none; } .mk-ring { opacity: 0.4; } }

.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 12px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; max-width: calc(100% - 20px); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend .l-steps { border-radius: 2px; width: 14px; height: 6px; background: var(--steps); }
.pop { position: absolute; z-index: 10; width: 240px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: 0 10px 30px rgba(8, 24, 28, 0.25); }
.pop h3 { margin: 0 0 2px; font-family: var(--font-display); font-size: 16px; }
.pop p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
.pop .actions .btn { height: 34px; padding: 0 10px; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 50; font-size: 13px; }

@media (max-width: 899px) {
  html, body { height: auto; }
  body { min-height: 100%; }
  .app { display: flex; flex-direction: column; }
  .mapwrap { order: -1; height: clamp(300px, 52vh, 480px); flex: none; }
  .panel { min-height: 0; }
  .out { overflow: visible; }
  .brand p { display: none; }
}
</style>

<header class="top">
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="9" fill="#1D4ED8"/><circle cx="19" cy="19" r="11" fill="none" stroke="#fff" stroke-width="2"/><path d="M19 9l4 10-4 10-4-10z" fill="#fff"/><path d="M19 9l4 10h-8z" fill="#FF8F5A"/></svg>
    <div>
      <h1>Campus Compass</h1>
      <p>Northfield Institute of Technology · find any lab, office or hall</p>
    </div>
  </div>
  <button class="icon-btn" id="theme" type="button" aria-label="Switch between light and dark theme" title="Switch theme">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main class="app">
  <section class="panel" aria-label="Find a place">
    <div class="controls">
      <div class="field">
        <label class="lbl" for="from">I am at</label>
        <select id="from"></select>
      </div>
      <div class="field combo">
        <label class="lbl" for="q">Where do you want to go?</label>
        <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Try &quot;chemistry lab&quot;, &quot;fee&quot; or &quot;LH 204&quot;"
          role="combobox" aria-expanded="false" aria-controls="sug" aria-autocomplete="list">
        <ul class="sug" id="sug" role="listbox" hidden></ul>
      </div>
      <label class="toggle" for="acc">
        <input type="checkbox" id="acc">
        <div><b>Step-free route</b><span>Avoids stairs and uses lifts. Walking time assumes a slower pace.</span></div>
      </label>
      <div>
        <div class="quick-label">Nearest to me</div>
        <div class="chips" id="quick"></div>
      </div>
    </div>
    <div class="out" id="out" aria-live="polite"></div>
  </section>

  <section class="mapwrap" aria-label="Campus map">
    <svg id="map" viewBox="0 0 1040 640" role="img" aria-label="Map of the campus with the route drawn on it"></svg>
    <div class="zoom">
      <button class="icon-btn" id="zin" type="button" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
      <button class="icon-btn" id="zout" type="button" aria-label="Zoom out"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"/></svg></button>
      <button class="icon-btn" id="zfit" type="button" aria-label="Fit route to screen" title="Fit route"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
    </div>
    <div class="legend" aria-hidden="true">
      <span><i style="background:var(--start)"></i>Start</span>
      <span><i style="background:var(--pin)"></i>Destination</span>
      <span><i class="l-steps"></i>Steps</span>
    </div>
    <div class="pop" id="pop" hidden></div>
  </section>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script>/* Campus Compass: data + routing logic (pure, no DOM) */
(function (root) {
  'use strict';
  var PX_M = 0.7; // metres per map unit
  var WALK = 1.3, WALK_ACC = 1.0; // m/s

  var CAMPUS = {
    name: 'Northfield Institute of Technology',
    nodes: {
      G: { x: 60, y: 320, name: 'Main Gate' },
      A: { x: 220, y: 320, name: 'Welcome Circle' },
      B: { x: 420, y: 320, name: 'Fountain Plaza' },
      C: { x: 640, y: 320, name: 'Clock Tower' },
      D: { x: 860, y: 320, name: 'East Junction' },
      N1: { x: 220, y: 190, name: 'Security Corner' },
      N2: { x: 420, y: 190, name: 'Tech Corner' },
      N3: { x: 640, y: 190, name: 'Workshop Corner' },
      N4: { x: 860, y: 190, name: 'Terrace Top' },
      S1: { x: 220, y: 470, name: 'Parking Corner' },
      S2: { x: 420, y: 470, name: 'South Crossing' },
      S3: { x: 640, y: 470, name: 'Sports Crossing' },
      S4: { x: 860, y: 470, name: 'Hostel Corner' }
    },
    // [from, to, street name, hasSteps]
    edges: [
      ['G', 'A', 'Entrance Road'],
      ['A', 'B', 'Central Avenue'], ['B', 'C', 'Central Avenue'], ['C', 'D', 'Central Avenue'],
      ['N1', 'N2', 'North Walk'], ['N2', 'N3', 'North Walk'], ['N3', 'N4', 'North Walk'],
      ['S1', 'S2', 'South Walk'], ['S2', 'S3', 'South Walk'], ['S3', 'S4', 'South Walk'],
      ['N1', 'A', 'West Lane'], ['A', 'S1', 'West Lane'],
      ['N2', 'B', 'Plaza Road'], ['B', 'S2', 'Plaza Road'],
      ['N3', 'C', 'Garden Lane'], ['C', 'S3', 'Garden Steps', true],
      ['N4', 'D', 'Terrace Steps', true], ['D', 'S4', 'Terrace Road']
    ],
    // rect [x,y,w,h], door [x,y] sits on a road
    buildings: [
      { id: 'ADM', name: 'Administration Block', short: 'Admin Block', rect: [250, 205, 140, 85], door: [350, 320], lift: true, floors: 3, hours: '8:30 am to 5:30 pm, Mon to Sat' },

      h += '<h2 class="sec-title">Recent</h2><ul class="list">' + recents.map(function (p) { return placeRow(p, d, 'data-pick'); }).join('') + '</ul>';
    }
    h += '<div><h2 class="sec-title">Browse the campus</h2></div><div class="chips" role="group" aria-label="Filter by type">' +
      L.CATS.map(function (c) { return '<button class="chip" type="button" data-cat="' + c.id + '" aria-pressed="' + (S.cat === c.id) + '">' + esc(c.label) + '</button>'; }).join('') + '</div>';
    var list = PLACES.filter(function (p) { return S.cat === 'all' || p.cat === S.cat; })
      .filter(function (p) { return S.cat !== 'all' || p.cat !== 'building'; })
      .slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    h += '<ul class="list">' + list.map(function (p) { return placeRow(p, d, 'data-pick'); }).join('') + '</ul>';
    return h;
  }

  function renderRoute() {
    var r = S.route, p = S.place, b = BMAP[p.b], h = '';
    var eyebrow = S.quick ? 'Nearest ' + L.QUICK.filter(function (k) { return k.key === S.quick; })[0].label.toLowerCase() : L.CAT_LABEL[p.cat];
    h += '<div class="rhead"><div><p class="eyebrow">' + esc(eyebrow) + '</p><h2>' + esc(p.name) + '</h2><p class="where">' + esc(b.name) +
      (p.cat === 'building' ? '' : ' · ' + L.floorLabel(p.floor) + ' · ' + esc(p.room)) + '</p></div>' +
      '<button class="icon-btn" type="button" data-act="clear" aria-label="Clear destination"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>';
    if (!r.ok) return h + '<p class="alert">' + esc(r.reason) + '</p>';
    h += '<dl class="stats"><div><dt>Distance</dt><dd>' + r.meters + '<small> m</small></dd></div><div><dt>Walk</dt><dd>' + r.minutes + '<small> min</small></dd></div>' +
      '<div><dt>Route</dt><dd><span class="badge ' + (r.stepFree ? 'ok' : 'warn') + '">' + (r.stepFree ? 'Step-free' : 'Has steps') + '</span></dd></div></dl>';
    r.warnings.forEach(function (w) { h += '<p class="alert">' + esc(w) + '</p>'; });
    r.notes.forEach(function (w) { h += '<p class="note">' + esc(w) + '</p>'; });
    h += '<ol class="steps">' + r.steps.map(function (s, i) {
      var inner = '<span class="ic">' + icon(s.kind) + '</span><span><span class="t">' + esc(s.title) + '</span>' + (s.detail ? '<span class="dt">' + esc(s.detail) + '</span>' : '') + '</span><span class="m">' + (s.m ? s.m + ' m' : '') + '</span>';
      return '<li><button class="step ' + s.kind + '" type="button" data-step="' + i + '"' + (i === S.activeStep ? ' aria-current="true"' : '') + '>' + inner + '</button></li>';
    }).join('') + '</ol>';
    if (r.indoor.length) {
      h += '<p class="divider">Inside ' + esc(b.short) + '</p><ol class="steps">' + r.indoor.map(function (s) {
        return '<li><div class="step ' + s.kind + '"><span class="ic">' + icon(s.kind) + '</span><span><span class="t">' + esc(s.title) + '</span><span class="dt">' + esc(s.detail) + '</span></span><span></span></div></li>';
      }).join('') + '</ol>';
    }
    if (S.alts.length) {
      var d = distMap();
      h += '<p class="divider">Other nearby options</p><ul class="list alts">' + S.alts.map(function (x) { return placeRow(x.p, d, 'data-alt'); }).join('') + '</ul>';
    }
    h += '<div class="actions"><button class="btn primary" type="button" data-act="copy">Copy directions</button><button class="btn" type="button" data-act="clear">New search</button></div>';
    return h;
  }

  function renderPanel() { out.innerHTML = S.place ? renderRoute() : renderBrowse(); }

  out.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-pick]'))) { choose(L.PMAP[t.getAttribute('data-pick')]); return; }
    if ((t = e.target.closest('[data-alt]'))) { choose(L.PMAP[t.getAttribute('data-alt')], true); return; }
    if ((t = e.target.closest('[data-cat]'))) { S.cat = t.getAttribute('data-cat'); renderPanel(); return; }
    if ((t = e.target.closest('[data-step]'))) {
      var i = +t.getAttribute('data-step'), st = S.route.steps[i];
      S.activeStep = S.activeStep === i ? -1 : i;
      renderPanel(); drawRoute();
      if (S.activeStep >= 0 && st.nodes.length) {
        animateTo(fitBox(boxOf(st.nodes.map(function (id) { return g.nodes[id]; })), 110, 300));
        if (window.matchMedia('(max-width: 899px)').matches) svg.parentElement.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
      } else fitRoute(true);
      var again = out.querySelector('[data-step="' + i + '"]'); if (again) again.focus({ preventScroll: true });
      return;
    }
    if ((t = e.target.closest('[data-act]'))) {
      var a = t.getAttribute('data-act');
      if (a === 'clear') clearPlace();
      if (a === 'copy') copyDirections();
    }
  });

  /* ---------- copy ---------- */
  function toast(msg) {
    var el = $('#toast'); el.textContent = msg; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2200);
  }
  function directionsText() {
    var r = S.route, p = S.place, b = BMAP[p.b], lines = [];
    lines.push('Directions to ' + p.name + ' (' + b.name + (p.cat === 'building' ? '' : ', ' + L.floorLabel(p.floor) + ', ' + p.room) + ')');
    lines.push('From: ' + L.startName(S.from) + ' · ' + r.meters + ' m · about ' + r.minutes + ' min' + (S.acc ? ' · step-free' : ''));
    var n = 0;
    r.steps.concat(r.indoor).forEach(function (s) { n++; lines.push(n + '. ' + s.title + (s.detail ? '. ' + s.detail : '')); });
    r.warnings.forEach(function (w) { lines.push('Note: ' + w); });
    return lines.join('\n');
  }
  function copyDirections() {
    if (!S.route || !S.route.ok) return;
    var text = directionsText();
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'width:100%;height:140px;margin-top:8px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);font:12px var(--font-mono)';
      out.appendChild(ta); ta.focus(); ta.select(); toast('Select and copy the text below');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Directions copied'); }, fallback);
    else fallback();
  }

  /* ---------- theme ---------- */
  var root = document.documentElement;
  var savedTheme = lsGet('cc.theme', null);
  if (savedTheme) root.setAttribute('data-theme', savedTheme);
  $('#theme').addEventListener('click', function () {
    var cur = root.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next); lsSet('cc.theme', next);
  });

  /* ---------- start ---------- */
  drawStatic();
  var first = PLACES.filter(function (p) { return p.name === 'Admissions Office'; })[0];
  S.place = first; q.value = first.name;
  renderQuick();
  fitRoute(false);
  refresh(false);
  fitRoute(false);
})();
</script>

</body></html>
